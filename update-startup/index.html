<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0E11" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Тренування</title>
    <style>
      /* Екран запуску: малюється одразу, до завантаження скриптів; React замінює його при старті */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0D0E11; }
      html[data-theme="light"] .boot { background: #F2F2F7; }
      .boot i { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(128,128,128,.28); border-top-color: #9bc77a; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><i></i></div></div>
    <script>
      // Світла/темна тема ще до малювання (без блимання)
      try {
        var m = localStorage.getItem('ui:theme');
        var light = m === 'light' || (m !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
